<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Degree Audit Page</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/audit.css">
    <link href="https://cdn.boxicons.com/3.0.8/fonts/basic/boxicons.min.css" rel="stylesheet">
</head>
<body>
    <nav class="sidebar">
        <div class="logo"> Graduation Planner </div>
        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="planner.html">My Planner</a>
            <a href="about.html">About Us</a>
            <a href="courses.html">Courses</a>
            <a href="degree_audit.html">Degree Audit</a> 
        </div>
    </nav>
 
    <main class="content">
        <h2 class="credits-title">00/128 Credits</h2>
        <div class="progress">
            <div class="progress-fill" style="width: 55%;"></div>
        </div>
 
        <div class="audit">
            <div class="expandable active">
                <h3 class="exptitle">Gen Ed Classes</h3>
                <p class="expcount">00 / 10</p>
                <p class="expstatus done"><i class="bx bx-check-circle"></i> All Sections Completed</p>
                <p class="expmain">main</p>
                <button class="toggle" aria-label="Toggle section">
                    <i class="bx bx-chevron-down"></i>
                </button>
            </div>
 
            <div class="expandable">
                <h3 class="exptitle">Engineering Courses</h3>
                <p class="expcount">00 / 55</p>
                <p class="expstatus"><i class="bx bx-time"></i> Hours Pending Review</p>
                <p class="expmain">main</p>
                <button class="toggle" aria-label="Toggle section">
                    <i class="bx bx-chevron-down"></i>
                </button>
            </div>
 
            <div class="expandable">
                <h3 class="exptitle">Technical Electives</h3>
                <p class="expcount">00 / 12</p>
                <p class="expstatus"><i class="bx bx-time"></i> Hours Pending Review</p>
                <p class="expmain">main</p>
                <button class="toggle" aria-label="Toggle section">
                    <i class="bx bx-chevron-down"></i>
                </button>
            </div>
        </div>
    </main>
 
    <script src="../JS Files/audit.js" defer></script>
</body>
</html>
