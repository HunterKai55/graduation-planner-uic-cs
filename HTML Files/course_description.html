<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Courses Pages</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css" integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg==" crossorigin="anonymous" referrerpolicy="no-referrer">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/courses.css">
</head>
<body>
    <div class="page-container">
        <nav class="sidebar">
            <div class="logo"> Graduation Planner </div>
                <div class="nav-links">
                    <a href="index.html">Home</a>
                    <a href="planner.html">My Planner</a>
                    <a href="about.html">About Us</a>
                    <a href="courses.html">Courses</a>
                    <a href="degree_audit.html">Degree Audit</a>
                </div>
        </nav>

        <main>

            <div class="grid-container">
                <div class="box" style="grid-area: box-1">
                    <h1>Course Name</h1>
                    <p id="courseName"></p>
                </div>
                <div class="box" style="grid-area: box-2">
                    <h1>Credit Hours</h1>
                    <h1 id="creditHours"></h1>
                </div>
                <div class="box" style="grid-area: box-3">
                    <h1>Input Professor Names</h1>
                    <form id="professorForm">
                        <input type="text" id="fnameText" placeholder="First Name" required>
                        <input type="text" id="lnameText" placeholder="Last Name" required>
                        <button id="searchProfessor" type="submit"> Search </button>
                    </form>
                </div>
                <div class="box" style="grid-area: box-4">
                    <h1>Course Description</h1>
                    <p id="courseDescription"></p>
                </div>
                <div id="professorRating" class="box" style="grid-area: box-5">
                    <h1>Professor Rating</h1>
                    <h1 id="overallRating">--/5</h1>
                    <h1>Would Take Again Percentage</h1>
                    <h1 id="takeAgain">--</h1>
                    <h1>Average Difficulty</h1>
                    <h1 id="averageDifficulty">--/5</h1>
                </div>
            </div>

            <div id="professorComments" class="professorComments">
                <h1>Student Comments</h1>
            </div>
    

        </main>
    </div>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="../JS Files/course_description.js"></script>
</body>
</html>
