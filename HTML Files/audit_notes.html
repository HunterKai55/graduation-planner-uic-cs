<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Course Notes</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/audit_notes.css">
    <link href="https://cdn.boxicons.com/3.0.8/fonts/basic/boxicons.min.css" rel="stylesheet">
</head>
<body>
    <nav class="sidebar">
        <div class="logo"> Graduation Planner </div>
        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="planner.html">My Planner</a>
            <a href="about.html">About Us</a>
            <a href="courses.html">Courses</a>
            <a href="degree_audit.html">Degree Audit</a>
        </div>
    </nav>
 
    <main class="notes-page">
        <div class="notes-toolbar">
            <button class="back-btn" id="back-btn" aria-label="Back to degree audit">
                <i class="bx bx-chevron-left"></i>
            </button>
            <button class="action-btn save-btn" id="save-btn">Save</button>
            <button class="action-btn delete-btn" id="delete-btn">Delete Notes</button>
            <span class="notes-status" id="notes-status" aria-live="polite"></span>
        </div>
        <h2 class="notes-title" id="notes-title">Notes For:</h2>
        <textarea class="notes-box" id="notes-box" placeholder="Write your notes here..."></textarea>
    </main>
 
    <script src="../JS Files/audit_notes.js" defer></script>
</body>
</html>
