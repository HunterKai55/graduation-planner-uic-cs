<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Course Notes</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/audit_notes.css">
    <link href="https://cdn.boxicons.com/3.0.8/fonts/basic/boxicons.min.css" rel="stylesheet">
</head>
<body>
    <!-- The Top Bar-->
    <header class="topbar">
        <div class="brand">
            <div class="brand-icon">🎓</div>
            <div>
                <h1>UIC CS</h1>
                <p>Graduation Tracker</p>
            </div>
        </div>
        <div class="user">
            <div class="avatar"></div>
            <div>
                <strong>Username</strong>
                <p>B.S. Computer Science • Year</p>
            </div>
        </div>
    </header>
    <!-- Top Bar End-->
    <div class="layout">
            <!-- SIDE -->
        <nav class="sidebar">
            <h2>Graduation Track</h2>
            <a href="index.html">Schedule</a>
            <a href="planner.html">My Plan</a>
            <a href="courses.html">Course Information</a>
            <a href="degree_audit.html" class="active">Degree Audit</a>
            <hr>
            <a href="settings.html">Settings</a>
        </nav>
        <!-- SIDE END-->
        <main class="notes-page">
            <div class="notes-toolbar">
                <button class="back-btn" id="back-btn" aria-label="Back to degree audit">
                    <i class="bx bx-chevron-left"></i>
                </button>
                <button class="action-btn save-btn" id="save-btn">Save</button>
                <button class="action-btn delete-btn" id="delete-btn">Delete Notes</button>
                <span class="notes-status" id="notes-status" aria-live="polite"></span>
            </div>
            <h2 class="notes-title" id="notes-title">Notes For:</h2>
            <textarea class="notes-box" id="notes-box" placeholder="Write your notes here..."></textarea>
        </main>
    </div>
 
    <script src="JS Files/audit_notes.js" defer></script>
</body>
</html>
